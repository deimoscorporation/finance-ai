# FinancePro + PostgreSQL
#   cp .env.example .env   # defina SECRET_KEY
#   docker compose up -d --build
#   http://localhost:8000
services:
  web:
    build: .
    image: financepro:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "False"
      DATABASE_URL: postgres://financepro:${POSTGRES_PASSWORD:-financepro}@db:5432/financepro
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      # Acesso local via HTTP. Atrás de HTTPS, remova esta linha (cookies seguros).
      SECURE_COOKIES: ${SECURE_COOKIES:-False}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - media:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: financepro
      POSTGRES_USER: financepro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financepro}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financepro -d financepro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  media:
