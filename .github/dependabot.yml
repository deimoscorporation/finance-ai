version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      langchain:
        patterns: ["langchain*", "langgraph*", "langsmith", "openai"]
      django:
        patterns: ["django*", "whitenoise", "gunicorn", "dj-database-url"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
