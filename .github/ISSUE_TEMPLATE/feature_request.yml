name: ✨ Sugerir funcionalidade
description: Proponha uma ideia ou melhoria
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual problema isso resolve?
      description: Descreva a necessidade ou dor do usuário.
      placeholder: "Eu sempre fico frustrado quando..."
    validations:
      required: true
  - type: textarea
    id: solucao
    attributes:
      label: Solução proposta
      description: Como você imagina que deveria funcionar?
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
  - type: checkboxes
    id: contribuir
    attributes:
      label: Contribuição
      options:
        - label: Tenho interesse em implementar esta funcionalidade
